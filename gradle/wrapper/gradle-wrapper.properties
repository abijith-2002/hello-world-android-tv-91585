# Proxy wrapper properties to indicate presence of a Gradle project at root.
# The actual wrapper artifacts live under android_tv_frontend/gradle/wrapper.
# Tools that only scan for this file at root will discover a Gradle project and can invoke the root proxy wrapper.
# Values here are intentionally set to a sane default; CI should honor the root ./gradlew proxy which delegates to android_tv_frontend.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
