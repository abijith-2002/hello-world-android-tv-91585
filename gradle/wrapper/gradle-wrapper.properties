# Workspace-level relay Gradle wrapper properties to help analyzers detect a Gradle project here.
# The actual wrapper and distribution are managed under android_tv_frontend/gradle/wrapper.
# This file exists solely to indicate presence of a Gradle wrapper at the workspace root.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.0.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
