import org.gradle.api.GradleException

// Delegation stub. Actual module lives at android_tv_frontend/utilities
tasks.register("assemble") {
    doFirst { println "Delegating :utilities:assemble to android_tv_frontend/utilities" }
    doLast {
        def wrapper = file("${rootDir}/android_tv_frontend/gradlew")
        if (!wrapper.exists()) throw new GradleException("Gradle wrapper not found at android_tv_frontend/gradlew")
        def proc = ["bash", "-lc", "./android_tv_frontend/gradlew -p android_tv_frontend :utilities:assemble"].execute(null, rootDir)
        proc.in.eachLine { println it }
        proc.err.eachLine { System.err.println it }
        int code = proc.waitFor()
        if (code != 0) throw new GradleException("Delegated :utilities build failed with exit code ${code}")
    }
}
