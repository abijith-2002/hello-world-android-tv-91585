# Helps automated mobile analyzers detect the Android/Kotlin Gradle project root.
gradle.root=true
project.root.dir=.
settings.gradle.present=true
modules=:app,:list,:utilities
wrapper=./gradlew
apk.debug.path=app/build/outputs/apk/debug/app-debug.apk
note=This file is used by CI/project analyzers to locate the Android project root under android_tv_frontend.
