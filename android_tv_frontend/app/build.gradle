plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.example.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
        debug {
            debuggable true
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.11"
    }

    packagingOptions {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {

    // AndroidX
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Material Components for card and elevation
    implementation "com.google.android.material:material:1.12.0"

    // Leanback for Android TV support
    implementation "androidx.leanback:leanback:1.1.0-rc02"

    // Jetpack Compose UI (stable & TV)
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.ui:ui:1.6.6"
    implementation "androidx.compose.ui:ui-tooling:1.6.6"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.6"
    implementation "androidx.compose.foundation:foundation:1.6.6"
    implementation "androidx.compose.material:material:1.6.6"
    implementation "androidx.compose.material:material-icons-core:1.6.6"
    implementation "androidx.compose.material:material-icons-extended:1.6.6"
    implementation "androidx.compose.runtime:runtime:1.6.6"
    implementation "androidx.compose.runtime:runtime-livedata:1.6.6"
    implementation "androidx.compose.animation:animation:1.6.6"
    implementation "androidx.compose.animation:animation-graphics:1.6.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    // Compose TV
    implementation "androidx.tv:tv-foundation:1.0.0-alpha09"
    implementation "androidx.tv:tv-material:1.0.0-alpha09"
    // Coil for image loading (Compose)
    implementation "io.coil-kt:coil-compose:2.6.0"

    // Unit testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
