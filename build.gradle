import org.gradle.api.GradleException

// This is a thin delegating build file to aid tools that scan the repository root
// for an Android/Kotlin Gradle project. The actual project lives in android_tv_frontend.
// Please invoke Gradle with: ./android_tv_frontend/gradlew -p android_tv_frontend assembleDebug
task explainDelegation {
    doLast {
        println "This is a delegating build.gradle at repository root."
        println "Actual Android project is located at: android_tv_frontend"
        println "Run: ./android_tv_frontend/gradlew -p android_tv_frontend assembleDebug"
    }
}

tasks.register("assembleDebug") {
    doFirst {
        println "Delegating assembleDebug to android_tv_frontend"
    }
    doLast {
        def wrapper = file("android_tv_frontend/gradlew")
        if (!wrapper.exists()) {
            throw new GradleException("Gradle wrapper not found at android_tv_frontend/gradlew")
        }
        def proc = ["bash", "-lc", "./android_tv_frontend/gradlew -p android_tv_frontend assembleDebug"].execute()
        proc.in.eachLine { println it }
        proc.err.eachLine { System.err.println it }
        int code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("Delegated build failed with exit code ${code}")
        }
    }
}
