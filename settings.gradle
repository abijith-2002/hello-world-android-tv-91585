rootProject.name = "hello-world-android-tv-91585-root"

def subRoot = file("android_tv_frontend")
if (!subRoot.exists()) {
    throw new GradleException("Expected Android project under android_tv_frontend but directory not found")
}

/*
 Create explicit module mappings at repository root that point to the real modules
 inside android_tv_frontend. This helps analyzers and CI that rely on root-level
 settings.gradle to discover Android modules.
*/
include(":app")
project(":app").projectDir = file("android_tv_frontend/app")

include(":list")
project(":list").projectDir = file("android_tv_frontend/list")

include(":utilities")
project(":utilities").projectDir = file("android_tv_frontend/utilities")
